<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réinitialiser le mot de passe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">Réinitialiser votre mot de passe</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <div class="mb-3">
            <label for="motdepasse" class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" id="motdepasse" name="motdepasse" placeholder="Entrez un nouveau mot de passe" required>
        </div>
        <button type="submit" class="btn btn-success">Mettre à jour le mot de passe</button>
    </form>

    <p class="mt-3"><a href="{{ url_for('login') }}">Retour à la connexion</a></p>
</div>
</body>
</html>
